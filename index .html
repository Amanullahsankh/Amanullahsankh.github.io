<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amanullah Sankh — Developer Portfolio</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#EEF1F5;font-family:Inter,"SF Pro Display","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:#0F172A}
  #hero{height:100vh;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px}
  .stage{width:min(100%,calc((100vh - 96px) * 16 / 9));}
  canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:12px;box-shadow:0 10px 40px rgba(15,23,42,.12);background:#FAFAF9}
  .bar{width:min(100%,calc((100vh - 96px) * 16 / 9));display:flex;align-items:center;gap:10px}
  button{font:600 14px/1 inherit;font-family:inherit;border:1px solid #CBD5E1;background:#fff;color:#0F172A;padding:10px 16px;border-radius:10px;cursor:pointer;min-width:84px;transition:background .15s,border-color .15s}
  button:hover{background:#F8FAFC;border-color:#94A3B8}
  button.primary{background:#0F172A;color:#fff;border-color:#0F172A}
  button.primary:hover{background:#1E293B}
  input[type=range]{flex:1;accent-color:#2563EB;height:4px}
  #time{font-variant-numeric:tabular-nums;font-size:13px;color:#475569;min-width:104px;text-align:right}

  /* ===== MOBILE PORTRAIT OUTER LAYOUT =====
     The canvas keeps its own aspect ratio (set from JS to match the phone's available height, so the
     canvas itself fills the screen) and the controls follow it directly with a small gap.
     No flex-grow / stretched stage anywhere. */
  @media (max-width:700px) and (orientation:portrait){
    html,body{overflow-x:hidden;width:100%}
    #hero{height:auto;min-height:100dvh;display:block;gap:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));margin:0 auto;overflow-x:hidden}
    .stage{width:100%;display:block;margin:0 auto}
    canvas{width:100%;height:auto;aspect-ratio:1080/1550;border-radius:12px;box-shadow:0 8px 28px rgba(15,23,42,.12)}
    .bar{width:100%;margin:10px auto 0;padding:0;gap:6px;flex-wrap:nowrap;align-items:center}
    button{padding:11px 10px;min-width:68px;font-size:14px;border-radius:12px;flex:0 0 auto}
    input[type=range]{flex:1 1 auto;min-width:0;height:6px;margin:0}
    #time{flex:0 0 auto;min-width:78px;font-size:11px}
  }
</style>
</head>
<body>
<div id="hero">
<div class="stage"><canvas id="c" width="1920" height="1080" role="img" aria-label="Animated developer portfolio for Amanullah Sankh: about, skills, projects, education, leadership, certifications, resume and contact."></canvas></div>
<div class="bar">
  <button id="play" class="primary">Pause</button>
  <button id="restart">Restart</button>
  <input id="seek" type="range" min="0" max="76" step="0.01" value="0" aria-label="Timeline">
  <span id="time">0.0 / 76.0s</span>
</div>
</div>

<script>
(() => {
  const c = document.getElementById('c'), ctx = c.getContext('2d', { alpha: false });

  const W = 1920, H = 1080, DUR = 76, HERO = 8;

  const ease = x => 1 - Math.pow(1 - clamp(x), 3);
  const easeQ = x => 1 - Math.pow(1 - clamp(x), 5);
  const easeIO = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };

  const innQ = (t, s, d) => easeQ((t - s) / d);
  const sa = (t, s, e, fi, fo) => clamp((t - s) / fi) * (fo > 0 ? clamp((e - t) / fo) : 1);
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, k) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * k)).join(',')})`; };

  function rr(x, y, w, h, r, g = ctx) {
    r = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }
  function txt(s, x, y, size, wt, col, al = 'left', ls = 0) {
    ctx.font = `${wt} ${size}px ${FONT}`;
    if (HAS_LS) ctx.letterSpacing = ls + 'px';
    ctx.textAlign = al; ctx.fillStyle = col; ctx.fillText(s, x, y);
  }
  const mwCache = new Map();
  function mw(s, size, wt) {
    const k = wt + '|' + size + '|' + s;
    let v = mwCache.get(k);
    if (v === undefined) {
      ctx.font = `${wt} ${size}px ${FONT}`;
      if (HAS_LS) ctx.letterSpacing = '0px';
      v = ctx.measureText(s).width; mwCache.set(k, v);
    }
    return v;
  }
  function fit(s, maxW, size, wt) {
    const w = mw(s, size, wt);
    return w > maxW ? size * maxW / w : size;
  }
  function wrap(s, maxW, size, wt) {
    const words = s.split(' '), lines = []; let cur = '';
    for (const w of words) {
      const test = cur ? cur + ' ' + w : w;
      if (mw(test, size, wt) > maxW && cur) { lines.push(cur); cur = w; } else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  const PAD = 120, cardCache = new Map();
  function getCard(w, h, r) {
    const key = w + 'x' + h + 'x' + r;
    let cv = cardCache.get(key);
    if (cv) return cv;
    cv = document.createElement('canvas'); cv.width = w + PAD * 2; cv.height = h + PAD * 2;
    const g = cv.getContext('2d');
    g.save();
    g.shadowColor = 'rgba(15,23,42,0.08)'; g.shadowBlur = 40; g.shadowOffsetY = 14;
    rr(PAD, PAD, w, h, r, g); g.fillStyle = '#fff'; g.fill();
    g.restore();
    rr(PAD, PAD, w, h, r, g); g.strokeStyle = LINE; g.lineWidth = 2; g.stroke();
    cardCache.set(key, cv);
    return cv;
  }
  function card(x, y, w, h, r = 28) {
    ctx.drawImage(getCard(Math.round(w), Math.round(h), r), x - PAD, y - PAD);

  function chip(x, y, label, size, fill = '#fff', stroke = LINE) {
    const w = mw(label, size, 600) + size * 1.1, h = size * 1.9;
    rr(x, y, w, h, h / 2); ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke();
    txt(label, x + w / 2, y + h / 2 + size * 0.35, size, 600, INK, 'center');
    return w;
  }

  // Phones use a real portrait composition instead of stretching/cropping the desktop canvas.
  // The portrait content block is designed on a 1080 x 1550 area (MCH). The canvas' logical height (MH) is
  // fitted to the phone's available viewport height (see mobileFit), so the canvas itself fills the screen
  // above the controls. The content block is centred vertically inside it; the header/progress bar stay
  // pinned to the true top/bottom edges.
  const MW = 1080, MCH = 1550, MH_MAX = 2400;

  const mobileQuery = () => window.matchMedia('(max-width: 700px) and (orientation: portrait)').matches;
  const bgM = document.createElement('canvas'); bgM.width = MW; bgM.height = MH_MAX;
  (() => {

    b.fillStyle = BG; b.fillRect(0, 0, MW, MH_MAX);

    fitDirty = false;

    const padV = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    const barH = barEl.offsetHeight + (parseFloat(bs.marginTop) || 0);
    const w = stageEl.clientWidth || window.innerWidth;
    const avail = window.innerHeight - padV - barH - 4;
    MH = Math.max(MCH, Math.min(MH_MAX, Math.round(MW * avail / w)));

    E.forEach((q,i)=>{const y=245+i*505,r=inn(t,s+1+i*1.4,.7);ctx.save();ctx.globalAlpha=A*r;mcard(54,y+(1-r)*26,972,445,28);mtxt(q[0],90,y+70+(1-r)*26,24,600,ACC,'left',4);mtxt(q[1],90,y+150+(1-r)*26,34,700,INK);mtxt(q[2],90,y+215+(1-r)*26,27,400,MUTE);mtxt(q[3],90,y+285+(1-r)*26,29,600,INK);ctx.restore();});
  }

  function mDrawLeadership(t){
    const [s]=T.leadership,A=scA(T.leadership);if(A<.001)return;mhead(t,s,A,'LEADERSHIP & ACHIEVEMENTS','Beyond the code.',48);
    LD.forEach(([a,b],i)=>{const y=205+i*180,r=inn(t,s+.7+i*.7,.55);ctx.save();ctx.globalAlpha=A*r;mcard(54,y+(1-r)*24,972,160,22);rr(78,y+27+(1-r)*24,6,98,3);ctx.fillStyle=ACC;ctx.fill();mtxt(a,110,y+65+(1-r)*24,fit(a,860,28,700),700,INK);wrap(b,850,21,400).forEach((ln,k)=>mtxt(ln,110,y+105+k*26+(1-r)*24,21,400,MUTE));ctx.restore();});
  }

  function mDrawCertifications(t){
    const [s]=T.certs,A=scA(T.certs);if(A<.001)return;mhead(t,s,A,'CERTIFICATIONS','Learning and recognition.',52);
    CE.forEach(([n,iss,yr],i)=>{const col=i%2,row=Math.floor(i/2),x=54+col*492,y=245+row*255,w=468,h=220,r=inn(t,s+.6+i*.55,.55);ctx.save();ctx.globalAlpha=A*r;mcard(x,y+(1-r)*24,w,h,24);mtxt(yr,x+28,y+42+(1-r)*24,20,700,ACC,'left',3);wrap(n,w-56,27,700).forEach((ln,k)=>mtxt(ln,x+28,y+82+k*28+(1-r)*24,27,700,INK));wrap(iss,w-56,20,400).forEach((ln,k)=>mtxt(ln,x+28,y+82+Math.min(2,wrap(n,w-56,27,700).length)*28+8+k*24+(1-r)*24,20,400,MUTE));ctx.restore();});
    const r=inn(t,s+6,.5);ctx.save();ctx.globalAlpha=A*r;mtxt('MEMBERSHIPS',54,1365+(1-r)*18,20,600,SOFT,'left',4);['IEEE Computer Society · 2026','IEEE Student Membership · 2026','IEEE VTS · 2026'].forEach((l,k)=>chip(54+(k%2)*500,1405+Math.floor(k/2)*58,l,20,'#F1F5F9',LINE));ctx.restore();
  }

  function mDrawResume(t){
    const [s]=T.resume,A=scA(T.resume);if(A<.001)return;ctx.save();let r=inn(t,s+.1,.4);ctx.globalAlpha=A*r;mtxt('RESUME',540,180+(1-r)*14,24,600,ACC,'center',5);r=innQ(t,s+.3,.8);mtxt('Interested in my work?',540,350+(1-r)*28,62,700,INK,'center',-2);r=inn(t,s+.9,.6);mtxt('View / Download my resume.',540,425+(1-r)*20,29,400,MUTE,'center');r=innQ(t,s+1.4,.8);ctx.globalAlpha=A*r;const bx=170,by=610,bw=740,bh=105;rr(bx,by,bw,bh,58);ctx.fillStyle=INK;ctx.fill();mtxt('DOWNLOAD RESUME',540,676,28,700,'#fff','center',2);ctx.restore();ctx.save();ctx.globalAlpha=A*inn(t,s+2.2,.5);mtxt(RESUME,540,775,21,500,SOFT,'center');ctx.restore();
  }

  function mDrawContact(t){
    const [s]=T.contact,A=scA(T.contact);if(A<.001)return;ctx.save();let r=inn(t,s+.1,.4);ctx.globalAlpha=A*r;mtxt('CONTACT',540,175+(1-r)*14,24,600,ACC,'center',5);r=innQ(t,s+.25,.8);mtxt("LET'S CONNECT",540,295+(1-r)*28,66,700,INK,'center',-2);ctx.restore();
    CONTACT.forEach((q,i)=>{const r2=innQ(t,s+.8+i*.35,.85);if(r2<.001)return;const x=54,y=455+i*190,w=972,h=145,yy=y+(1-r2)*30;ctx.save();ctx.globalAlpha=A*Math.min(1,r2*1.4);mcard(x,yy,w,h,22);mtxt(q[0],90,yy+52,20,600,SOFT,'left',4);wrap(q[1],820,25,500).forEach((ln,k)=>mtxt(ln,90,yy+80+k*28,25,500,INK));ctx.restore();});
  }

  function mDrawFinal(t){
    const [s,e]=T.final,A=sa(t,s,e,.4,1.2);if(A<.001)return;ctx.save();let r=inn(t,s+.1,.7);ctx.globalAlpha=A*r;rr(440,190,200,200,48);ctx.fillStyle=INK;ctx.fill();mtxt('AS',540,370,88,700,'#fff','center');r=inn(t,s+.5,.5);mtxt('AMANULLAH SANKH',540,535+(1-r)*16,24,600,ACC,'center',5);r=inn(t,s+.8,.7);mtxt('AI & Software Developer',540,660+(1-r)*26,62,700,INK,'center',-2);r=inn(t,s+1.3,.7);wrap('Building AI-powered and full-stack applications.',900,29,400).forEach((ln,k)=>mtxt(ln,540,740+k*40+(1-r)*22,29,400,MUTE,'center'));r=inn(t,s+3,.8);rr(500,860+(1-r)*20,80,4,2);ctx.fillStyle=LINE;ctx.fill();mtxt("Let's build something meaningful.",540,940+(1-r)*20,38,700,INK,'center');r=inn(t,s+4.6,.7);mtxt('GitHub · LinkedIn · Email',540,1040+(1-r)*18,25,600,ACC,'center',2);ctx.restore();
  }

  function drawMobile(t){
    timeNow=t;ctx.globalAlpha=1;
    ctx.drawImage(bgM,0,0,MW,MH,0,0,MW,MH);
    // centre the 1080x1550 content block inside the (taller) phone canvas
    const oy=Math.round((MH-MCH)/2);
    ctx.save();ctx.translate(0,oy);
    if(t<HERO+.45)mDrawHero(t);
    if(t>=HERO){mDrawAbout(t);mDrawSkills(t);mDrawProjects(t);mDrawEducation(t);mDrawLeadership(t);mDrawCertifications(t);mDrawResume(t);mDrawContact(t);mDrawFinal(t);}
    ctx.restore();
    ctx.globalAlpha=1;
    mChrome(t);
  }

  function draw(t) {
    mobileMode = mobileQuery();
    if (fitDirty || (mobileMode !== (c.dataset.mob === '1'))) { c.dataset.mob = mobileMode ? '1' : '0'; mobileFit(); }
    if (mobileMode) {
      if (c.width !== MW || c.height !== MH) { c.width=MW; c.height=MH; }
      drawMobile(t);
      return;
    }
    if (c.width !== W || c.height !== H) { c.width=W; c.height=H; }
    timeNow = t;
    ctx.globalAlpha = 1;
    ctx.drawImage(bg, 0, 0);
    if (t < HERO + 0.45) {
      drawHero(t);
      if (t > HERO) { ctx.globalAlpha = clamp((t - HERO) / 0.4); ctx.drawImage(bg, 0, 0); }
    }
    ctx.globalAlpha = 1;
    if (t >= HERO) {
      drawAbout(t); drawSkills(t); drawProjects(t); drawEducation(t); drawLeadership(t);
      drawCertifications(t); drawResume(t); drawContact(t); drawFinal(t);
    }
    ctx.globalAlpha = 1;
    chrome(t);
  }

  const Sfx = (() => {
    let ac = null, master = null, dest = null, noise = null;
    function init() {
      if (ac) return ac;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC({ latencyHint: 'interactive' });
      master = ac.createGain(); master.gain.value = 0.9;
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -20; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.2;
      master.connect(comp); comp.connect(ac.destination);
      if (ac.createMediaStreamDestination) { dest = ac.createMediaStreamDestination(); comp.connect(dest); }
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      return ac;
    }
    const ready = () => !!ac && ac.state === 'running';
    function resume() {
      const a = init();
      return a && a.state === 'suspended' ? a.resume().catch(() => {}) : Promise.resolve();
    }
    function tone(f, dur, peak, o = {}) {
      if (!ready()) return;
      const t0 = ac.currentTime + (o.delay || 0);
      const osc = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, t0);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
      lp.type = 'lowpass'; lp.frequency.value = 4200;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + (o.a || 0.012));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(lp); lp.connect(g); g.connect(master);
      osc.start(t0); osc.stop(t0 + dur + 0.05);
    }
    function sweep(dur, f0, f1, peak) {
      if (!ready()) return;
      const t0 = ac.currentTime;
      const src = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = noise; src.loop = true;
      bp.type = 'bandpass'; bp.Q.value = 0.9;
      bp.frequency.setValueAtTime(f0, t0); bp.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + dur * 0.4);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(bp); bp.connect(g); g.connect(master);
      src.start(t0); src.stop(t0 + dur + 0.05);
    }
    return {
      resume, ready,
      stream: () => dest ? dest.stream : null,
      intro: () => { tone(523.25, 0.6, 0.045); tone(784, 0.7, 0.03, { delay: 0.07 }); sweep(0.5, 400, 2400, 0.025); },
      wipe:  () => { sweep(0.6, 300, 2600, 0.05); tone(174.6, 0.55, 0.03, { to: 233 }); },
      pop:   () => tone(660, 0.2, 0.03, { to: 880 }),
      tick:  () => tone(1400, 0.06, 0.02, { type: 'triangle' }),
      next:  () => { sweep(0.45, 500, 2000, 0.03); tone(587.3, 0.28, 0.028); },
      blip:  i => tone(740 + i * 70, 0.14, 0.018),
      chord: () => [523.25, 659.25, 783.99].forEach((f, i) => tone(f, 1.1, 0.03, { delay: i * 0.06, a: 0.04 }))
    };
  })();

  const CUES = [];
  const cue = (tm, fn) => CUES.push([tm, fn]);
  cue(0.10, Sfx.intro); cue(1.00, Sfx.tick);
  cue(2.00, Sfx.wipe); cue(2.35, Sfx.tick);
  // extended scenes
  Object.values(T).forEach(([s]) => { cue(s, Sfx.wipe); cue(s + 0.3, Sfx.tick); });
  [1.0, 1.3, 1.6, 1.9].forEach(d => cue(8 + d, Sfx.pop));
  SK.forEach((_, i) => cue(14.6 + i * 0.55, Sfx.pop));
  [1, 2, 3, 4].forEach(i => cue(21 + i * 4, Sfx.next));
  [1, 2].forEach(i => cue(41 + 1.0 + (i - 1) * 1.4, Sfx.pop));
  LD.forEach((_, i) => cue(46.7 + i * 0.75, Sfx.pop));
  CE.forEach((_, i) => cue(54.6 + i * 0.7, Sfx.pop));
  cue(67.2, Sfx.blip.bind(null, 2)); cue(69.4, Sfx.pop);
  [0, 1, 2].forEach(i => cue(66.8 + i * 0.35, Sfx.pop));
  cue(70.8, Sfx.tick); cue(72.0, Sfx.chord); cue(74.6, Sfx.pop);
  CUES.sort((a, b) => a[0] - b[0]);
  let cueIdx = 0;
  const resetCues = tm => { cueIdx = 0; while (cueIdx < CUES.length && CUES[cueIdx][0] <= tm) cueIdx++; };
  function fireCues(tm) {
    while (cueIdx < CUES.length && CUES[cueIdx][0] <= tm) {
      const [ct, fn] = CUES[cueIdx++];
      if (tm - ct < 0.25 && Sfx.ready()) fn();
    }
  }

  const playBtn = document.getElementById('play'), restartBtn = document.getElementById('restart'),
        seek = document.getElementById('seek'), timeEl = document.getElementById('time');
  seek.max = DUR;
  let t = 0, playing = true, last = performance.now();
  let recorder = null, recording = false, recChunks = [], recDiscard = false, status = '', statusTimer = 0;
  let uiKey = '';

  function updateUI() {
    const pb = playing ? 'Pause' : (t >= DUR ? 'Replay' : 'Play');
    const tm = recording ? '● REC ' + t.toFixed(1) + 's' : status || (t.toFixed(1) + ' / ' + DUR.toFixed(1) + 's');
    const key = pb + '|' + tm;
    if (key === uiKey) return;
    uiKey = key;
    if (playBtn.textContent !== pb) playBtn.textContent = pb;
    seek.value = t;
    timeEl.textContent = tm;
  }
  function setStatus(s, ms) {
    status = s; clearTimeout(statusTimer);
    if (ms) statusTimer = setTimeout(() => { status = ''; updateUI(); }, ms);
    uiKey = ''; updateUI();
  }
  function togglePlay() {
    if (recording) return;
    if (playing) playing = false;
    else { if (t >= DUR) { t = 0; resetCues(0); } playing = true; }
    last = performance.now(); updateUI();
  }
  function restart() {
    if (recording) return;
    Sfx.resume();
    t = 0; resetCues(-1); playing = true; last = performance.now(); updateUI();
  }

  function pickMime() {
    if (!window.MediaRecorder) return '';
    return ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
      .find(m => MediaRecorder.isTypeSupported(m)) || '';
  }
  function startRec() {
    if (recording) { recDiscard = true; stopRec(); return; }
    const mime = pickMime();
    if (!mime || !c.captureStream) { setStatus('Rec unsupported', 3000); return; }
    Sfx.resume().then(() => {
      const stream = c.captureStream(60);
      const as = Sfx.stream();
      if (as) as.getAudioTracks().forEach(tr => stream.addTrack(tr));
      recChunks = []; recDiscard = false;
      try { recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12000000 }); }
      catch (err) { setStatus('Rec failed', 3000); return; }
      recorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
      recorder.onstop = () => {
        stream.getTracks().forEach(tr => tr.stop());
        recording = false;
        if (recDiscard) { setStatus('Rec cancelled', 2000); return; }
        const blob = new Blob(recChunks, { type: 'video/webm' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'reel.webm';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 10000);
        setStatus('Saved reel.webm', 3500);
      };
      t = 0; resetCues(-1); playing = true; last = performance.now();
      recording = true; status = '';
      recorder.start(250);
      updateUI();
    });
  }
  function stopRec() { if (recorder && recorder.state !== 'inactive') recorder.stop(); }
  function onEnd() { if (recording) setTimeout(stopRec, 700); }

  // Clickable hotspots: projects -> GitHub, certifications -> Drive, resume -> PDF, contact rows -> external links
  const PROJECT_HOTS = PROJECTS.map((_, i) => [T.projects[0] + i * 4, T.projects[0] + (i + 1) * 4, 140, 260, 1640, 700, GITHUB, false]);
  const HOT = [
    ...PROJECT_HOTS,
    [T.certs[0], T.certs[1], 140, 340, 1640, 570, CERTS, false],
    [T.resume[0] + 1.6, T.resume[1], BTN.x, BTN.y, BTN.w, BTN.h, RESUME, true],
    ...LINKS.map((h, i) => [T.contact[0] + 1.2 + i * 0.35, T.contact[1], 410, 470 + i * 125, 1100, 92, h, false])
  ];
  const HOT_MOBILE = [
    ...PROJECTS.map((_,i)=>[T.projects[0]+i*4,T.projects[0]+(i+1)*4,54,175,972,1370,GITHUB,false]),
    [T.certs[0],T.certs[1],54,245,972,1280,CERTS,false],
    [T.resume[0]+1.4,T.resume[1],170,500,740,115,RESUME,true],
    ...LINKS.map((h,i)=>[T.contact[0]+0.8+i*.35,T.contact[1],54,380+i*175,972,135,h,false])
  ];
  function hotAt(e) {
    const b=c.getBoundingClientRect();
    const isMob=mobileQuery();
    const scaleW=(isMob?MW:W)/b.width, scaleH=(isMob?MH:H)/b.height;
    const x=(e.clientX-b.left)*scaleW;
    // mobile content block is vertically centred inside the canvas
    const y=(e.clientY-b.top)*scaleH-(isMob?Math.round((MH-MCH)/2):0);
    const list=isMob?HOT_MOBILE:HOT;
    return list.find(([s,en,hx,hy,hw,hh])=>t>=s&&t<en&&x>=hx&&x<=hx+hw&&y>=hy&&y<=hy+hh);
  }
  c.addEventListener('mousemove', e => { c.style.cursor = hotAt(e) ? 'pointer' : 'default'; });
  c.addEventListener('click', e => {
    const h = hotAt(e); if (!h) return;
    const a = document.createElement('a'); a.href = h[6];
    if (h[7]) a.download = h[6]; else { a.target = '_blank'; a.rel = 'noopener'; }
    document.body.appendChild(a); a.click(); a.remove();
  });

  playBtn.addEventListener('click', () => { Sfx.resume(); togglePlay(); });
  restartBtn.addEventListener('click', restart);
  seek.addEventListener('input', () => {
    if (recording) { seek.value = t; return; }
    playing = false; t = +seek.value; resetCues(t); updateUI();
  });
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) restart(); }
    else if ((e.key === 'r' || e.key === 'R') && !e.repeat && !e.ctrlKey && !e.metaKey && !e.altKey) startRec();
  });
  document.addEventListener('keyup', e => { if (e.code === 'Space') e.preventDefault(); });
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
    document.addEventListener(ev, () => Sfx.resume(), { once: true, passive: true }));
  document.addEventListener('visibilitychange', () => { last = performance.now(); });

  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (playing) {
      t += dt * PLAYBACK_RATE;
      let ended = false;
      if (t >= DUR) { t = DUR; playing = false; ended = true; }
      fireCues(t);
      if (ended) onEnd();
    }
    draw(t);
    updateUI();
    requestAnimationFrame(frame);
  }
  const start = () => { last = performance.now(); updateUI(); requestAnimationFrame(frame); };
  Promise.all([
    document.fonts && document.fonts.ready ? document.fonts.ready.catch(() => {}) : Promise.resolve(),
    loadPhoto().catch(() => {})
  ]).then(start);
})();
</script>
